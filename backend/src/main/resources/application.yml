spring:
  application:
    name: spendly-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/spendly
    username: spendly
    password: spendly_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

spendly:
  jwt:
    secret: ${SPENDLY_JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    access-token-ttl-minutes: 15
  google:
    client-id: ${SPENDLY_GOOGLE_CLIENT_ID:changeme.apps.googleusercontent.com}
  default-tenant-id: "00000000-0000-0000-0000-000000000001"

logging:
  level:
    com.spendly: DEBUG
    org.hibernate.SQL: WARN