spring:
  application:
    name: spendly-backend

  datasource:
    url: ${SPENDLY_DB_URL:jdbc:postgresql://localhost:5432/spendly}
    username: ${SPENDLY_DB_USERNAME:spendly}
    password: ${SPENDLY_DB_PASSWORD:spendly_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

spendly:
  jwt:
    secret: ${SPENDLY_JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    access-token-ttl-minutes: 15
  google:
    client-id: ${SPENDLY_GOOGLE_CLIENT_ID:changeme.apps.googleusercontent.com}
  resend:
    api-key: ${SPENDLY_RESEND_API_KEY:changeme}
    from-address: ${SPENDLY_RESEND_FROM:onboarding@resend.dev}
  default-tenant-id: "00000000-0000-0000-0000-000000000001"
  cors:
    allowed-origin: ${SPENDLY_CORS_ORIGIN:http://localhost:3000}

logging:
  level:
    com.spendly: DEBUG
    org.hibernate.SQL: WARN